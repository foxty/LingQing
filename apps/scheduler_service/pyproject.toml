[project]
name = "lingqing-scheduler-service"
version = "2.0.0"
description = "LingQing Scheduler Service - Background task orchestration"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["lingqing-shared", "apscheduler>=3.10.0"]

[tool.uv.sources]
