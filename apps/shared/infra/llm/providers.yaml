# Platform LLM/Embedding provider catalog (presets for tenant configuration).
#
# Structure:
# - providers[].key: stable preset slug (used in tenant llm_providers.preset_key)
# - providers[].name: display name for UI
# - providers[].api_base: default LLM endpoint URL
# - providers[].embedding_api_base: optional embedding endpoint override
# - providers[].type: provider type (openai-compatible)
# - providers[].llm_models[]: LLM model entries (string or {key, model_id, status})
# - providers[].embedding_models[]: embedding model entries
# - providers[].metadata.thinking_request_mode: omit | extra_body_thinking | reasoning_effort
# - llm_models[].metadata.supports_thinking: true when extended reasoning is available
# - llm_models[].metadata.thinking_effort_map: none|low|medium|high -> API value or omit
#   Policy: none -> "none" when gateway supports disable; none -> low when thinking cannot be disabled
# - llm_models[].metadata.exposes_thinking_content: true when gateway returns reasoning/thinking blocks (see DBX reason-model docs)
# - llm_models[].default_params: per-model overrides (e.g. temperature: 1 for GPT-5.x); merged at profile create and resolve
#
# Catalog is read-only at runtime; tenant credentials live in DB (llm_providers).

default_params:
  temperature: 0.2
  max_tokens: 4000
  top_p: 0.9

providers:
  - key: bailian
    name: 阿里云百炼
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    type: openai-compatible
    metadata:
      thinking_request_mode: extra_body_thinking
    llm_models:
      - key: qwen3.6-plus
        model_id: qwen3.6-plus
        metadata:
          supports_thinking: true
      - key: qwen3.6-flash
        model_id: qwen3.6-flash
        metadata:
          supports_thinking: true
      - key: qwen3.5-plus
        model_id: qwen3.5-plus
        metadata:
          supports_thinking: true
      - key: qwen3.5-flash
        model_id: qwen3.5-flash
        metadata:
          supports_thinking: true
      - key: qwen3.6-27b
        model_id: qwen3.6-27b
        metadata:
          supports_thinking: true
      - key: deepseek-v4-pro
        model_id: deepseek-v4-pro
        metadata:
          supports_thinking: true
      - key: deepseek-v4-flash
        model_id: deepseek-v4-flash
        metadata:
          supports_thinking: true
    embedding_models:
      - text-embedding-v4
      - text-embedding-v3

  - key: baidu-qianfan
    name: 百度智能云
    api_base: https://qianfan.baidubce.com/v2
    embedding_api_base: https://qianfan.baidubce.com/v2/embedding
    type: openai-compatible
    llm_models:
      - ernie-5.1
      - ernie-5.0
    embedding_models:
      - qwen3-embedding-8b
      - qwen3-embedding-4b
      - bge-large-zh
      - bge-large-en

  - key: deepseek
    name: Deepseek
    api_base: https://api.deepseek.com
    type: openai-compatible
    llm_models:
      - deepseek-v4-pro
      - deepseek-v4-flash

  - key: xiaomi-mimo
    name: Xiaomi MIMO
    api_base: https://api.mimo.xiaomi.com/v1
    type: openai-compatible
    llm_models:
      - mimo-v2.5-pro
      - mimo-v2.5
      - mimo-v2.5-tts
      - mimo-v2.5-tts-voicedesign
      - mimo-v2.5-tts-voiceclone
      - mimo-v2-pro
      - mimo-v2-omni
      - mimo-v2-tts
      - mimo-v2-flash

  - key: databricks-ai-gateway
    name: Databricks AI Gateway
    api_base: https://<workspace>.cloud.databricks.com/ai-gateway/mlflow/v1
    type: openai-compatible
    metadata:
      thinking_request_mode: reasoning_effort
    llm_models:
      - key: system.ai.deepseek-v4-flash-0731
        model_id: system.ai.deepseek-v4-flash-0731
        metadata:
          supports_thinking: true
          thinking_effort_map:
            "none": low
            low: low
            medium: high
            high: max
      - key: system.ai.deepseek-v4-1-flash
        model_id: system.ai.deepseek-v4-1-flash
        metadata:
          supports_thinking: true
          thinking_effort_map:
            "none": "none"
            low: low
            medium: high
            high: max
      - key: system.ai.glm-5-3
        model_id: system.ai.glm-5-3
        metadata:
          supports_thinking: true
          thinking_effort_map:
            "none": low
            low: low
            medium: high
            high: max
      - key: system.ai.glm-5-3-flash
        model_id: system.ai.glm-5-3-flash
        metadata:
          supports_thinking: true
          thinking_effort_map:
            "none": low
            low: low
            medium: high
            high: max
      - key: system.ai.gpt-5-5
        name: GPT 5.5
        model_id: system.ai.gpt-5-5
        default_params:
          temperature: 1
          top_p: null

    embedding_models: []

  - key: ollama
    name: Ollama
    api_base: http://127.0.0.1:11434/v1
    type: openai-compatible
    llm_models: []
    embedding_models: []
