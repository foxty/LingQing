# Platform LLM/Embedding provider catalog (presets for tenant configuration).
#
# Structure:
# - providers[].key: stable preset slug (used in tenant llm_providers.preset_key)
# - providers[].name: display name for UI
# - providers[].api_base: default LLM endpoint URL
# - providers[].embedding_api_base: optional embedding endpoint override
# - providers[].type: provider type (openai-compatible)
# - providers[].llm_models[]: LLM model entries (string or {key, model_id, status})
# - providers[].embedding_models[]: embedding model entries
#
# Catalog is read-only at runtime; tenant credentials live in DB (llm_providers).

default_params:
  temperature: 0.1
  max_tokens: 4000
  top_p: 0.9

providers:
  - key: bailian
    name: 阿里云百炼
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    type: openai-compatible
    llm_models:
      - qwen3.6-plus
      - qwen3.6-flash
      - qwen3.5-plus
      - qwen3.5-flash
      - qwen3.6-27b
      - deepseek-v4-pro
      - deepseek-v4-flash
    embedding_models:
      - text-embedding-v4
      - text-embedding-v3

  - key: bailian-coding-plan
    name: 阿里云百炼 Coding Plan
    api_base: https://coding.dashscope.aliyuncs.com/v1
    type: openai-compatible
    llm_models:
      - glm-5
      - glm-4.7
      - kimi-k2.5
      - qwen3.5-plus
      - MiniMax-M2.5
    embedding_models: []

  - key: tencent-cloud
    name: 腾讯云
    api_base: https://api.lkeap.cloud.tencent.com/v1
    type: openai-compatible
    llm_models: []
    embedding_models: []

  - key: baidu-qianfan
    name: 百度智能云
    api_base: https://qianfan.baidubce.com/v2
    embedding_api_base: https://qianfan.baidubce.com/v2/embedding
    type: openai-compatible
    llm_models:
      - ernie-5.1
      - ernie-5.0
    embedding_models:
      - qwen3-embedding-8b
      - qwen3-embedding-4b
      - bge-large-zh
      - bge-large-en

  - key: baidu-qianfan-coding-plan
    name: 百度智能云 Coding Plan
    api_base: https://qianfan.baidubce.com/v2/coding
    type: openai-compatible
    llm_models:
      - deepseek-v3.2
      - kimi-k2.5
      - glm-5
      - minimax-m2.5
      - ernie-4.5-turbo-20260402
      - deepseek-v4-flash
      - glm-5.1
    embedding_models: []

  - key: opencode-go
    name: OpenCode Go
    api_base: https://api.opencode.go/v1
    type: openai-compatible
    llm_models:
      - glm-5.1
      - glm-5
      - kimi-k2.5
      - kimi-k2.6
      - deepseek-v4-pro
      - deepseek-v4-flash
      - minimax-m2.7
      - minimax-m2.5
      - qwen3.6-plus
      - qwen3.5-plus
      - mimo-v2.5
      - mimo-v2.5-pro
    embedding_models: []

  - key: deepseek
    name: Deepseek
    api_base: https://api.deepseek.com
    type: openai-compatible
    llm_models:
      - deepseek-v4-pro
      - deepseek-v4-flash

  - key: xiaomi-mimo
    name: Xiaomi MIMO
    api_base: https://api.mimo.xiaomi.com/v1
    type: openai-compatible
    llm_models:
      - mimo-v2.5-pro
      - mimo-v2.5
      - mimo-v2.5-tts
      - mimo-v2.5-tts-voicedesign
      - mimo-v2.5-tts-voiceclone
      - mimo-v2-pro
      - mimo-v2-omni
      - mimo-v2-tts
      - mimo-v2-flash

  - key: xiaomi-mimo-coding-plan
    name: Xiaomi MIMO Coding Plan
    api_base: https://token-plan-cn.xiaomimimo.com/v1
    type: openai-compatible
    llm_models:
      - mimo-v2.5-pro
      - mimo-v2.5
      - mimo-v2.5-tts
      - mimo-v2.5-tts-voicedesign
      - mimo-v2.5-tts-voiceclone
      - mimo-v2-pro
      - mimo-v2-omni
      - mimo-v2-tts
      - mimo-v2-flash

  - key: databricks-ai-gateway
    name: Databricks AI Gateway
    api_base: https://<workspace>.cloud.databricks.com/ai-gateway/mlflow/v1
    type: openai-compatible
    llm_models:
      - system.ai.deepseek-v4-flash-0731
      - system.ai.deepseek-v4-1-flash
      - system.ai.glm-5-3-flash
    embedding_models: []
