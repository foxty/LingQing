[project]
name = "lingqing-shared"
version = "2.0.0"
description = "LingQing Shared - Shared libraries for LingQing platform"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # Shared library specific dependencies (core packages in parent project)
    "aiomysql>=0.2.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiohttp>=3.14.0",
    "bcrypt>=4.1.0",
    "beautifulsoup4>=4.14.2",
    "chromadb==1.4.1",
    "docx2txt>=0.9",
    "python-docx>=1.1.2",
    "langchain-chroma==1.1.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=0.3.0",
    "lxml>=6.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "pyyaml>=6.0",
    "sqlglot>=25.0.0",
    "tiktoken>=0.5.0",
    "unstructured[md,pptx]>=0.24.0",
    "ftfy>=6.0.0",
    "jieba>=0.42.1",
    "nltk>=3.10.3",
    # Database connectors (for analytics_db managers)
    "databricks-sql-connector>=3.0.0",
    "databricks-sqlalchemy>=0.4.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
