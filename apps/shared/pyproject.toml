[project]
name = "lingqing-shared"
version = "2.0.0"
description = "LingQing Shared - Shared libraries for LingQing platform"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # Shared library specific dependencies (core packages in parent project)
    "aiomysql>=0.2.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiohttp>=3.14.0",
    "bcrypt>=4.1.0",
    "chromadb==1.4.1",
    "langchain-chroma==1.1.0",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=1.1.0",
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "pyyaml>=6.0",
    "sqlglot>=25.0.0",
    "tiktoken>=0.5.0",
    "jieba>=0.42.1",
    "nltk>=3.10.3",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
