name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      tenant-app-portal: ${{ steps.filter.outputs.tenant-app-portal }}
      tenant-manager-portal: ${{ steps.filter.outputs.tenant-manager-portal }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/tenant_app_service/**'
              - 'apps/tenant_manager_service/**'
              - 'apps/scheduler_service/**'
              - 'apps/sandbox_service/**'
              - 'apps/shared/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'config/**'
            tenant-app-portal:
              - 'apps/tenant_app_portal/**'
            tenant-manager-portal:
              - 'apps/tenant_manager_portal/**'
            shared:
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'
              - 'nx.json'
              - 'project.json'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          uv sync --all-groups
          npm ci

      - name: Lint
        run: npx nx run root:lint

      - name: Test
        run: npx nx run root:test:ci

      - name: Check API specs
        run: npm run check-api-spec

      - name: Check live app SDK
        run: npm run check-live-app-sdk

  tenant-app-portal:
    name: Tenant app portal
    needs: changes
    if: needs.changes.outputs.tenant-app-portal == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/tenant_app_portal/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/tenant_app_portal

      - name: Lint
        run: npx nx run tenant_app_portal:lint

      - name: Build
        run: npx nx run tenant_app_portal:build

      - name: Test
        run: npx nx run tenant_app_portal:test

  tenant-manager-portal:
    name: Tenant manager portal
    needs: changes
    if: needs.changes.outputs.tenant-manager-portal == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/tenant_manager_portal/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/tenant_manager_portal

      - name: Lint
        run: npx nx run tenant_manager_portal:lint

      - name: Build
        run: npx nx run tenant_manager_portal:build
