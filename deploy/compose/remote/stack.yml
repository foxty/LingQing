# LingQing remote server stack
# Pre-built registry images; external PostgreSQL by default.
# Optional bundled Postgres: docker compose --profile bundled-postgres up -d
#   (or ./bootstrap.sh --with-postgres)
# Use on one VM per environment (prod or staging); only .env differs between VMs.
#
# Required environment variables:
#   REGISTRY_URL: Container registry URL (e.g., docker.io/myorg, ghcr.io/myorg)
#   VERSION: Image version tag (e.g., v1.0.0, latest)
#
# Production Deployment Guidelines:
# 1. Database: Use managed service (RDS, Azure DB) with proper connection pooling
# 2. Network: Configure in isolated VPC/network with proper security groups
# 3. Load Balancing: Use cloud load balancer (ALB, NLB, etc.) for multi-region
# 4. Monitoring: Enable CloudWatch/Application Insights for production metrics
# 5. Images: Pre-build and push to registry before deployment
# Use .env from deploy/env/.env.template (DATA_ROOT_PATH=/app/data, DATA_ROOT_HOST_PATH, etc.).
# DATA_ROOT_HOST_PATH must be an absolute host directory bind-mounted to /app/data (tenant data + sandbox nested docker).
# Only SANDBOX_RUNNER_IMAGE is set here so it tracks REGISTRY_URL + VERSION from the deploy invocation.
#
# Resource caps are sized for 1 tenant / ~50 users on a single host. Scale up mem_limit/cpus
# (or split Docling/Chroma) before adding tenants or heavy concurrent agent load.

# Fixed project name so `docker compose up` from any bundle directory does not fork a second stack.
name: lingqing

services:
  # Bundled PostgreSQL (demo / internal VM only — not for production HA).
  postgres:
    profiles: [bundled-postgres]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - backend-net

  sandbox-controller:
    image: ${REGISTRY_URL}/sandbox-controller:${VERSION}
    env_file:
      - .env
    environment:
      - SANDBOX_RUNNER_IMAGE=${REGISTRY_URL}/sandbox-runner:${VERSION}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT_HOST_PATH:?DATA_ROOT_HOST_PATH is required}:/app/data
    mem_limit: 768m
    cpus: 0.5
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - backend-net

  # ==================== Vector DB (Chroma Server) ====================
  chroma:
    image: chromadb/chroma:1.4.1
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    mem_limit: 2g
    cpus: 1.0
    restart: on-failure:3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - backend-net

  docling-serve:
    image: ${DOCLING_IMAGE:-quay.io/docling-project/docling-serve-cpu:v1.34.0}
    env_file:
      - .env
    environment:
      - DOCLING_SERVE_ENABLE_UI=${DOCLING_SERVE_ENABLE_UI:-0}
      - DOCLING_SERVE_MAX_NUM_PAGES=${DOCLING_SERVE_MAX_NUM_PAGES:-200}
      # Set DOCLING_SERVE_API_KEY in .env when auth is required (must match DOCLING_API_KEY on backend).
    mem_limit: ${DOCLING_MEM_LIMIT:-8g}
    cpus: ${DOCLING_CPUS:-2.0}
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - backend-net

  # ==================== Scheduler Service ====================
  scheduler-service:
    image: ${REGISTRY_URL}/backend-app:${VERSION}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - APP_MODULE=scheduler_service
      - DOCUMENT_PARSER=${DOCUMENT_PARSER:-default}
      - DOCLING_SERVICE_URL=${DOCLING_SERVICE_URL:-http://docling-serve:5001}
      - DOCLING_TASK_TIMEOUT_SECONDS=${DOCLING_TASK_TIMEOUT_SECONDS:-600}
      - DOCLING_API_KEY=${DOCLING_API_KEY:-}
      - MINERU_SERVICE_URL=${MINERU_SERVICE_URL:-}
    volumes:
      - ${DATA_ROOT_HOST_PATH:?DATA_ROOT_HOST_PATH is required}:/app/data
    depends_on:
      - chroma
    mem_limit: 1536m
    cpus: 1.0
    restart: on-failure:3
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - backend-net

  # ==================== Backend Service ====================
  tenant-app-service:
    image: ${REGISTRY_URL}/backend-app:${VERSION}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - APP_MODULE=tenant_app_service
      - DOCUMENT_PARSER=${DOCUMENT_PARSER:-default}
      - DOCLING_SERVICE_URL=${DOCLING_SERVICE_URL:-http://docling-serve:5001}
      - DOCLING_TASK_TIMEOUT_SECONDS=${DOCLING_TASK_TIMEOUT_SECONDS:-600}
      - DOCLING_API_KEY=${DOCLING_API_KEY:-}
      - MINERU_SERVICE_URL=${MINERU_SERVICE_URL:-}
    volumes:
      - ${DATA_ROOT_HOST_PATH:?DATA_ROOT_HOST_PATH is required}:/app/data
    depends_on:
      chroma:
        condition: service_started
      sandbox-controller:
        condition: service_started
      postgres:
        condition: service_healthy
        required: false
    mem_limit: 2g
    cpus: 1.5
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - backend-net

  # ==================== Tenant Manager Service ====================
  tenant-manager-service:
    image: ${REGISTRY_URL}/backend-app:${VERSION}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - APP_MODULE=tenant_manager_service
    volumes:
      - ${DATA_ROOT_HOST_PATH:?DATA_ROOT_HOST_PATH is required}:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    mem_limit: 512m
    cpus: 0.5
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - backend-net

  # ==================== Frontend - Nginx Reverse Proxy + Frontend ====================
  gateway-service:
    image: ${REGISTRY_URL}/frontend:${VERSION}
    ports:
      - "127.0.0.1:${GATEWAY_SERVICE_PORT:-8080}:80"
    depends_on:
      - tenant-app-service
      - tenant-manager-service
    mem_limit: 512m
    cpus: 0.5
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - backend-net

volumes:
  chroma_data:
    driver: local
  postgres_data:
    driver: local

networks:
  backend-net:
    driver: bridge
